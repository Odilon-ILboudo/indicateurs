<mat-card
  class="indicator-card"
  [class.clickable]="clickable"
  [class.loading]="isLoading"
  [style.border-left]="getThresholdColor() ? '4px solid ' + getThresholdColor() : 'none'"
  [routerLink]="clickable ? [routeBasePath + '/indicator', indicator.id] : null"
  [queryParams]="clickable && queryParams ? queryParams : null"
  [matTooltip]="clickable && isChartVisualization() ? 'Cliquez pour voir le graphique complet' : (clickable ? 'Cliquez pour plus de détails' : '')"
  [matTooltipDisabled]="suppressCardTooltip"
  matTooltipPosition="above">

  <mat-card-content>
    <!-- État de chargement -->
    <div class="loading-overlay" *ngIf="isLoading">
      <mat-icon>sync</mat-icon>
    </div>

    <!-- Contenu normal -->
    <ng-container *ngIf="!isLoading">
      <div class="card-header">
        <div class="value-section">
          <ng-container *ngIf="!isChartVisualization()">
            <span class="value" [style.color]="displayColor">{{ getFormattedValue() }}</span>
            <span class="unit" *ngIf="activeViz?.unit" [style.color]="displayColor">
              {{ activeViz!.unit }}
            </span>
          </ng-container>
          <ng-container *ngIf="isChartVisualization()">
            <mat-icon class="chart-placeholder-icon" [style.color]="displayColor">bar_chart</mat-icon>
          </ng-container>
        </div>
        <div class="icon-section">
          <div class="icon-bg" [style.backgroundColor]="displayColor">
            <mat-icon>{{ contextIcon(indicator?.contextType) }}</mat-icon>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <div class="title-section">
          <span
            *ngIf="!editingDisplayTitle || !displayTitle"
            class="title"
            [class.title--editable]="!!displayTitle"
            (click)="startTitleEdit($event)">
            {{ displayTitle ?? indicator.name }}
          </span>
          <input
            *ngIf="editingDisplayTitle && displayTitle"
            #titleInput
            class="title-edit-input"
            [(ngModel)]="draftDisplayTitle"
            (keydown.enter)="confirmTitleEdit()"
            (keydown.escape)="cancelTitleEdit()"
            (blur)="confirmTitleEdit()"
            (click)="$event.stopPropagation()"
          />
        </div>
        <mat-icon class="arrow-icon" *ngIf="!editingDisplayTitle">arrow_forward</mat-icon>
      </div>

      <div class="card-context" *ngIf="indicator?.contextType">
        <div class="context-info">
          <mat-icon>label</mat-icon>
          <span>{{ getContextLabel(indicator.contextType) }}</span>
        </div>
        <div class="card-actions">
          <button
            class="edit-button"
            mat-icon-button
            matTooltip="Paramètres"
            matTooltipPosition="above"
            (mouseenter)="suppressCardTooltip = true"
            (mouseleave)="suppressCardTooltip = false"
            (click)="openConfigModal($event)">
            <mat-icon>tune</mat-icon>
          </button>
          <mat-icon *ngIf="isPinned && !showPinButton"
            class="pin-indicator"
            matTooltip="Indicateur imposé par l'enseignant pour cette ressource"
            matTooltipPosition="above"
            (mouseenter)="suppressCardTooltip = true"
            (mouseleave)="suppressCardTooltip = false">lock</mat-icon>
          <button *ngIf="!isPinned && showPinButton"
            class="pin-button"
            mat-icon-button
            matTooltip="Figer pour ce cours/cette activité"
            matTooltipPosition="above"
            (mouseenter)="suppressCardTooltip = true"
            (mouseleave)="suppressCardTooltip = false"
            (click)="$event.stopPropagation(); pinToggle.emit()">
            <mat-icon>lock_open</mat-icon>
          </button>
          <button *ngIf="isPinned && showPinButton"
            class="pin-button pin-button--locked"
            mat-icon-button
            matTooltip="Modifier les seuils figés"
            matTooltipPosition="above"
            (mouseenter)="suppressCardTooltip = true"
            (mouseleave)="suppressCardTooltip = false"
            (click)="$event.stopPropagation(); pinToggle.emit()">
            <mat-icon>lock</mat-icon>
          </button>
          <button *ngIf="showDeleteButton"
            class="delete-button"
            mat-icon-button
            matTooltip="Supprimer"
            matTooltipPosition="above"
            nz-popconfirm
            nzPopconfirmTitle="Supprimer ce snapshot ?"
            nzPopconfirmPlacement="top"
            (nzOnConfirm)="deleteClick.emit()"
            (mouseenter)="suppressCardTooltip = true"
            (mouseleave)="suppressCardTooltip = false"
            (click)="$event.stopPropagation()">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      </div>

    </ng-container>
  </mat-card-content>
</mat-card>
