<mat-card
  class="indicator-card"
  [class.clickable]="clickable"
  [class.loading]="isLoading"
  [style.border-left]="'4px solid ' + getThresholdColor()"
  [routerLink]="clickable ? ['/dashboard/indicator', indicator.id] : null"
  [queryParams]="clickable && queryParams ? queryParams : null"
  [matTooltip]="clickable && isChartVisualization() ? 'Cliquez pour voir le graphique complet' : (clickable ? 'Cliquez pour plus de détails' : '')"
  matTooltipPosition="above">

  <mat-card-content>
    <!-- État de chargement -->
    <div class="loading-overlay" *ngIf="isLoading">
      <mat-icon>sync</mat-icon>
    </div>

    <!-- Contenu normal -->
    <ng-container *ngIf="!isLoading">
      <div class="card-header">
        <div class="value-section">
          <ng-container *ngIf="!isChartVisualization()">
            <span class="value">{{ getFormattedValue() }}</span>
            <span class="unit" *ngIf="activeViz?.unit">
              {{ activeViz!.unit }}
            </span>
            <span
              class="trend-badge"
              *ngIf="value?.trend"
              [class.trend-up]="value!.trend === 'up'"
              [class.trend-down]="value!.trend === 'down'"
              [class.trend-stable]="value!.trend === 'stable'"
              [matTooltip]="getTrendLabel(value!.trend!)">
              <mat-icon class="trend-icon">{{ getTrendIcon(value!.trend!) }}</mat-icon>
            </span>
          </ng-container>
          <ng-container *ngIf="isChartVisualization()">
            <mat-icon class="chart-placeholder-icon">bar_chart</mat-icon>
          </ng-container>
        </div>
        <div class="icon-section">
          <div class="icon-bg" [style.backgroundColor]="userColorPreference || activeViz?.color || '#7f8c8d'">
            <mat-icon>{{ activeViz?.icon || 'analytics' }}</mat-icon>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <div class="title-section">
          <span class="title">{{ displayTitle ?? indicator.name }}</span>
        </div>
        <mat-icon class="arrow-icon">arrow_forward</mat-icon>
      </div>

      <div class="card-context" *ngIf="indicator?.contextType">
        <div class="context-info">
          <mat-icon>label</mat-icon>
          <span>{{ getContextLabel(indicator.contextType) }}</span>
        </div>
        <button
          class="edit-button"
          mat-icon-button
          matTooltip="Configurer"
          matTooltipPosition="above"
          (click)="openConfigModal($event)">
          <mat-icon>edit</mat-icon>
        </button>
      </div>

    </ng-container>
  </mat-card-content>
</mat-card>
