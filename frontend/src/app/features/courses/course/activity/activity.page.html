<ui-layout-block [state]="context.state">
  <ng-container *ngIf="context.course && context.results && context.activity">
    <nz-page-header [nzSubtitle]="header" nzBackIcon (nzBack)="location.back()">
      <ng-template #header>
        <nz-breadcrumb nzSeparator="">
          <nz-breadcrumb-item>
            <mat-icon class="no-margin-left">local_library</mat-icon>
            <a [routerLink]="['/dashboard/courses', context.course.id]">{{ context.course.name }}</a>
          </nz-breadcrumb-item>
          <nz-breadcrumb-item>
            <mat-icon>widgets</mat-icon>
            {{ context.activity.title }}
          </nz-breadcrumb-item>
        </nz-breadcrumb>
      </ng-template>
    </nz-page-header>

    <nz-row [nzGutter]="[24, 24]" nzAlign="top">
      <nz-col nzXs="24" nzSm="24" nzMd="16" nzLg="16" nzXl="16">

        <!-- ── Section Indicateurs globaux de l'activité ───────────────── -->
        <nz-divider [nzText]="globalTitle" nzOrientation="left"></nz-divider>
        <ng-template #globalTitle>
          <span class="section-divider-btn" (click)="collapsedGlobal = !collapsedGlobal">
            <mat-icon class="section-chevron" [class.collapsed]="collapsedGlobal">expand_more</mat-icon>
            Indicateurs de l'activité
          </span>
        </ng-template>

        <ng-container *ngIf="!collapsedGlobal">
          <ng-container *ngIf="indicatorsLoading">
            <nz-spin nzSimple></nz-spin>
          </ng-container>
          <ng-container *ngIf="!indicatorsLoading">
            <ng-container *ngIf="activityIndicators.length > 0 && activityContext; else noIndicators">
              <nz-row [nzGutter]="[16, 16]">
                <nz-col
                  *ngFor="let ind of activityIndicators"
                  nzXs="24" nzSm="12" nzMd="12" nzLg="8" nzXl="8">
                  <ui-indicator-card
                    [indicator]="ind"
                    [context]="activityContext"
                    [clickable]="true"
                    [queryParams]="indicatorQueryParams"
                    [isPinned]="pinsByIndicatorId.has(ind.id)"
                    [showPinButton]="canManagePins"
                    [thresholdsOverride]="pinsByIndicatorId.get(ind.id)?.thresholdsOverride ?? null"
                    (pinToggle)="onPinToggle(ind)"
                  />
                </nz-col>
              </nz-row>
            </ng-container>
            <ng-template #noIndicators>
              <nz-empty
                nzNotFoundContent="Aucun indicateur de contexte 'activité' n'a été ajouté."
                style="margin: 16px 0 24px">
              </nz-empty>
            </ng-template>
          </ng-container>
        </ng-container>

        <!-- ── Section Indicateurs par groupe ─────────────── -->
        <ng-container *ngIf="!indicatorsLoading && groupIndicators.length > 0 && context.activity">
          <nz-divider [nzText]="groupTitle" nzOrientation="left"></nz-divider>
          <ng-template #groupTitle>
            <span class="section-divider-btn" (click)="collapsedGroup = !collapsedGroup">
              <mat-icon class="section-chevron" [class.collapsed]="collapsedGroup">expand_more</mat-icon>
              Indicateurs par groupe
            </span>
          </ng-template>

          <app-group-snapshots-panel
            *ngIf="!collapsedGroup"
            [groupIndicators]="groupIndicators"
            [activityId]="context.activity.id"
            [courseId]="context.course?.id ?? ''"
            [activityName]="context.activity.title ?? ''"
            [courseName]="context.course?.name ?? ''"
          />
        </ng-container>
