<ng-container *ngIf="context.course as course">
  <nz-row [nzGutter]="[24, 24]" nzAlign="top">
    <nz-col nzXs="24" nzSm="24" nzMd="18" nzLg="18" nzXl="18">
      <header id="tuto-course-dashboard-header">
        <ui-search-bar [searchbar]="searchbar" id="tuto-course-search-bar">
          <ng-template let-context> {{ context }}</ng-template>
        </ui-search-bar>
        <button
          *ngIf="course.permissions?.update && sections.length"
          nz-button
          nzType="primary"
          nzShape="round"
          (click)="addSection(sections[sections.length - 1])"
          id="tuto-course-add-section-button"
        >
          Ajouter une section
        </button>
        <button
          *ngIf="context.course?.permissions?.update && viewMode.mode === 'table'"
          nz-button
          nzType="primary"
          nzShape="round"
          [queryParamsHandling]="'merge'"
          [routerLink]="['/activities/create']"
          [queryParams]="{ course: course.id }"
          id="tuto-course-add-activity-table-button"
        >
          Ajouter une activité
        </button>
        <course-csv-download-button
          *ngIf="context.course?.permissions?.update"
          [activities]="activities"
          [name]="course.name"
          type="course"
          [courseId]="course.id"
          id="tuto-course-csv-download"
        />
        <div class="spacer"></div>
        <ui-view-mode
          #viewMode
          storageKey="course.view-mode"
          defaultMode="cards"
          [modes]="['cards', 'table']"
          id="tuto-course-view-mode"
        />
      </header>
      <div id="tuto-course-dashboard-content">
        <ng-container *ngIf="sections.length; else noSections">
          <ng-container [ngSwitch]="viewMode.mode">
            <ng-container *ngSwitchCase="'cards'">
              <nz-collapse nzGhost id="tuto-course-sections-container">
                <nz-collapse-panel
                  *ngFor="let item of sectionWithActivities; trackBy: trackSection"
                  [nzActive]="true"
                  [nzHeader]="header"
                  [nzExtra]="extra"
                  class="tuto-course-section-panel"
                  [id]="'tuto-course-section-' + item.section.id"
                >
                  <ng-template #header>
                    <span
                      nz-typography
                      [nzEditable]="course.permissions?.update"
                      [nzContent]="item.section.name"
                      (nzContentChange)="renameSection(item.section, $event)"
                      (click)="$event.stopPropagation()"
                      class="tuto-course-section-title"
                    >
                    </span>
                  </ng-template>
                  <ng-template #extra>
                    <button
                      *ngIf="context.course?.permissions?.update"
                      class="add-activity"
                      nz-button
                      nzType="primary"
                      nzShape="round"
                      nzSize="small"
                      [routerLink]="['/activities/create']"
                      [queryParams]="{
                        course: item.section.courseId,
                        section: item.section.id
                      }"
                      id="tuto-course-add-activity-button"
                      class="add-activity"
                    >
                      Ajouter une activité
                    </button>
                    <app-course-section-actions
                      *ngIf="course.permissions?.update"
                      [section]="item.section"
                      [sectionCount]="sections.length"
                      (moveUp)="moveUpSection(item.section)"
                      (moveDown)="moveDownSection(item.section)"
                      (insertBelow)="addSection(item.section)"
                      (edit)="editModeOn(item)"
                      (save)="saveSection(item)"
                      (remove)="deleteSection(item.section)"
                      [nbActivities]="numberOfActivities(item.section)"
                      id="tuto-course-section-actions"
                      class="tuto-course-section-actions"
                    />
                  </ng-template>
                  <course-activity-grid
                    [items]="item.activities"
                    [editmode]="item.editMode"
                    class="tuto-course-activities-grid"
                  >
                    <ng-container *ngTemplateOutlet="noActivities; context: { $implicit: item.section }" />
                  </course-activity-grid>
                </nz-collapse-panel>
              </nz-collapse>
            </ng-container>
            <ng-container *ngSwitchCase="'table'">
              <course-activity-table
                [activities]="flattenedActivities"
                [sections]="sections"
                id="tuto-course-activities-table"
              />
            </ng-container>
          </ng-container>
        </ng-container>
      </div>
    </nz-col>
    <nz-col nzXs="24" nzSm="24" nzMd="6" nzLg="6" nzXl="6">
      <aside id="tuto-course-statistics">
        <h4 class="section-title">Indicateurs du cours</h4>
        <ng-container *ngIf="indicatorsLoading">
          <nz-spin nzSimple></nz-spin>
        </ng-container>

        <ng-container *ngIf="!indicatorsLoading">
          <ng-container *ngIf="courseIndicators.length > 0 && courseContext; else noCourseIndicators">
            <nz-row [nzGutter]="[24, 24]">
              <nz-col *ngFor="let ind of courseIndicators" nzSpan="24">
                <ui-indicator-card
                  [indicator]="ind"
                  [context]="courseContext"
                  [clickable]="true"
                  [queryParams]="indicatorQueryParams"
                  [isPinned]="pinsByIndicatorId.has(ind.id)"
                  [showPinButton]="canManagePins"
                  [thresholdsOverride]="pinsByIndicatorId.get(ind.id)?.thresholdsOverride ?? null"
                  (pinToggle)="onPinToggle(ind)"
                />
              </nz-col>
            </nz-row>
          </ng-container>
          <ng-template #noCourseIndicators>
            <nz-empty
              nzNotFoundContent="Aucun indicateur de contexte 'cours' n'a été activé."
              style="margin: 16px 0 24px">
            </nz-empty>
          </ng-template>
        </ng-container>
      </aside>
    </nz-col>
  </nz-row>

  <!-- ── Section Mes statistiques (learner/teacher/admin course-aware) ────── -->
  <ng-container *ngIf="!indicatorsLoading && (learnerIndicators.length > 0 || teacherIndicators.length > 0 || adminIndicators.length > 0)">
    <nz-divider [nzText]="learnerTitle" nzOrientation="left"></nz-divider>
    <ng-template #learnerTitle>
      <span class="section-divider-btn" (click)="collapsedLearner = !collapsedLearner">
        <mat-icon class="section-chevron" [class.collapsed]="collapsedLearner">expand_more</mat-icon>
        Mes statistiques
      </span>
    </ng-template>

    <ng-container *ngIf="!collapsedLearner">
      <nz-row [nzGutter]="[16, 16]">
        <nz-col
          *ngFor="let ind of learnerIndicators"
          nzXs="24" nzSm="12" nzMd="12" nzLg="8" nzXl="8">
          <ui-indicator-card
            [indicator]="ind"
            [context]="learnerContext"
            [clickable]="true"
            [queryParams]="personalIndicatorQueryParams('learner')"
            [showPinButton]="false"
          />
        </nz-col>
        <nz-col
          *ngFor="let ind of teacherIndicators"
          nzXs="24" nzSm="12" nzMd="12" nzLg="8" nzXl="8">
          <ui-indicator-card
            [indicator]="ind"
            [context]="teacherContext"
            [clickable]="true"
            [queryParams]="personalIndicatorQueryParams('teacher')"
            [showPinButton]="false"
          />
        </nz-col>
        <nz-col
          *ngFor="let ind of adminIndicators"
          nzXs="24" nzSm="12" nzMd="12" nzLg="8" nzXl="8">
          <ui-indicator-card
            [indicator]="ind"
            [context]="adminContext"
            [clickable]="true"
            [queryParams]="personalIndicatorQueryParams('admin')"
            [showPinButton]="false"
          />
        </nz-col>
      </nz-row>
    </ng-container>
  </ng-container>

  <!-- ── Section Indicateurs par groupe (tout le cours, isCourseAware) ────── -->
  <ng-container *ngIf="!indicatorsLoading && groupIndicators.length > 0">
    <nz-divider [nzText]="groupTitle" nzOrientation="left"></nz-divider>
    <ng-template #groupTitle>
      <span class="section-divider-btn" (click)="collapsedGroup = !collapsedGroup">
        <mat-icon class="section-chevron" [class.collapsed]="collapsedGroup">expand_more</mat-icon>
        Indicateurs par groupe
      </span>
    </ng-template>

    <app-group-snapshots-panel
      *ngIf="!collapsedGroup"
      [groupIndicators]="groupIndicators"
      [courseId]="course.id"
      [courseName]="course.name"
    />
  </ng-container>
</ng-container>

<ng-template #noSections>
  <nz-empty [nzNotFoundContent]="noSectionsContent" [nzNotFoundFooter]="noSectionsFooter" id="tuto-course-no-sections">
    <ng-template #noSectionsContent>
      Ce cours ne contient aucune section. Les sections permettent d'organiser le contenu du cours en thématiques.
    </ng-template>
    <ng-template #noSectionsFooter>
      <button
        *ngIf="context.course?.permissions?.update"
        nz-button
        nzType="primary"
        (click)="addSection()"
        id="tuto-course-add-first-section-button"
      >
        Ajouter une section
      </button>
    </ng-template>
  </nz-empty>
</ng-template>

<ng-template let-section #noActivities>
  <nz-empty [nzNotFoundContent]="noActivitiesContent" id="tuto-course-no-activities">
    <ng-template #noActivitiesContent> Cette section ne contient aucune activité. </ng-template>
  </nz-empty>
</ng-template>
