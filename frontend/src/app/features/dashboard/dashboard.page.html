<mat-drawer-container>
  <mat-drawer mode="side" [(opened)]="drawerOpened" #drawer>
    <app-sidebar />
  </mat-drawer>

  <mat-drawer-content>
    <mat-toolbar>
      <app-toolbar (drawerToggle)="drawerOpened = !drawerOpened" />
    </mat-toolbar>
    <div class="router-outlet">
      <router-outlet />
    </div>
  </mat-drawer-content>
</mat-drawer-container>
