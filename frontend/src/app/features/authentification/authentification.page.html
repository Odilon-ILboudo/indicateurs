<section class="login-content">
  <header>
    <img class="logo" src="images/logo/platon.svg" alt="Logo PLaTon" />
  </header>
  <main>
    <h1>Connectez-vous à votre compte</h1>
    
      <mat-card-content>
        <mat-spinner *ngIf="connecting" [diameter]="32" [mode]="'indeterminate'"></mat-spinner>
      </mat-card-content>
      <mat-card-actions>
        @if (error) {
          <p class="error-msg">Une erreur est survenue lors de la connexion.</p>
          <button mat-raised-button color="primary" (click)="redirectToPlaton()">Réessayer</button>
        } @else if (!connecting) {
          @if (!showLocalForm) {
            <button mat-raised-button color="primary" (click)="redirectToPlaton()">SE CONNECTER</button>

            @if (!isProduction) {
              <button mat-stroked-button color="primary" (click)="toggleLocalForm()">Compte local (dev)</button>
            }
          } @else {
            <mat-form-field appearance="outline">
              <mat-label>Nom d'utilisateur</mat-label>
              <input matInput [(ngModel)]="localUsername" name="localUsername" (keyup.enter)="signInLocally()" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Mot de passe</mat-label>
              <input matInput type="password" [(ngModel)]="localPassword" name="localPassword" (keyup.enter)="signInLocally()" />
            </mat-form-field>
            @if (localError) {
              <p class="error-msg">{{ localError }}</p>
            }
            <button mat-raised-button color="primary" (click)="signInLocally()">Se connecter</button>
            <button mat-button (click)="toggleLocalForm()">Retour</button>
          }
        }
      </mat-card-actions>

  </main>
</section>
<section class="login-illustration">
  <h2>Platform for Learning and Teaching online</h2>
  <img src="images/illustrations/hero.png" alt="Illustration de PLaTon" />
</section>
