<!-- frontend/src/app/features/activity-indicator/activity-indicator.component.html -->
<div class="activity-indicator">
  <!-- État de chargement -->
  <div *ngIf="loading" class="loading-state">
    <nz-spin nzSimple></nz-spin>
    <p>Chargement des données...</p>
  </div>

  <!-- État d'erreur -->
  <div *ngIf="error && !loading" class="error-state">
    <mat-icon>error_outline</mat-icon>
    <p>Erreur lors du chargement des données</p>
    <button nz-button (click)="refresh()">Réessayer</button>
  </div>

  <!-- Contenu principal -->
  <mat-card *ngIf="data && !loading && !error" class="indicator-card">
    <mat-card-header>
      <mat-icon mat-card-avatar [style.color]="getColor(data.value)">trending_up</mat-icon>
      <mat-card-title>Tentatives avant réussite</mat-card-title>
      <mat-card-subtitle>{{ data.activityName || 'Activité' }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="value-container">
        <span class="value">{{ data.value | number:'1.1-1' }}</span>
        <span class="unit">tentatives</span>
      </div>

      <div class="gauge-container">
        <nz-progress
          [nzPercent]="getPercent(data.value)"
          [nzStrokeColor]="getColor(data.value)"
          nzStatus="active"
          [nzShowInfo]="false"
        ></nz-progress>
      </div>

      <div class="interpretation">
        <mat-icon>info</mat-icon>
        <span>{{ getInterpretation(data.value) }}</span>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        Actualiser
      </button>
    </mat-card-actions>
  </mat-card>
</div>
