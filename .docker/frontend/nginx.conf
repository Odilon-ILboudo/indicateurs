server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # REST API → NestJS
    location /api/ {
        proxy_pass http://indicateurs_api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Socket.io → NestJS
    location /socket.io/ {
        proxy_pass http://indicateurs_api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Widget embarqué (Web Component <indicateurs-app>) - chargé par un LMS externe (PLaTon ou
    # un autre) via <script>/<link>, jamais par navigation directe. Fichiers statiques uniquement,
    # pas de fallback SPA. Le CORS se règle côté API (voir api/src/main.ts, origin: true en prod) :
    # charger un <script>/<link> cross-origin ne nécessite pas d'en-tête CORS ici.
    location /embed/ {
        try_files $uri =404;
    }

    # Angular SPA — toutes les routes inconnues → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
