# Mode production : stack complète (RabbitMQ + API + Frontend Nginx)
# Prérequis : PLaTon tourne sur le même hôte, platon_postgres/platon_redis accessibles via platon-network.

# Rotation des logs Docker (json-file, 5x10 Mo/service) - pas de centralisation/alerting, hors scope pour l'instant.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Service éphémère : crée la base "indicators" si absente (PLaTon ne provisionne que POSTGRES_DB).
  init-db:
    image: postgres:13-alpine
    container_name: indicateurs_init_db
    logging: *default-logging
    env_file:
      - .env
    environment:
      PLATON_DB_HOST: platon_postgres
      PGPASSWORD: ${PLATON_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        until pg_isready -h "$$PLATON_DB_HOST" -U "$$PLATON_DB_USERNAME" -q; do
          echo "En attente de Postgres ($$PLATON_DB_HOST)..."
          sleep 2
        done
        exists=$$(psql -h "$$PLATON_DB_HOST" -U "$$PLATON_DB_USERNAME" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$INDICATORS_DB_NAME'")
        if [ "$$exists" = "1" ]; then
          echo "Base $$INDICATORS_DB_NAME déjà présente."
        else
          echo "Création de la base $$INDICATORS_DB_NAME..."
          psql -h "$$PLATON_DB_HOST" -U "$$PLATON_DB_USERNAME" -d postgres -c "CREATE DATABASE \"$$INDICATORS_DB_NAME\""
        fi
    networks:
      - platon-network
    restart: "no"

  rabbitmq:
    restart: always
    image: rabbitmq:3-management
    container_name: indicateurs_rabbitmq
    logging: *default-logging
    environment:
      # Ne prend effet qu'au premier démarrage sur volume vierge - "rabbitmq-init" ci-dessous corrige sinon.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-indicateurs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@indicateurs_rabbitmq
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - platon-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service éphémère : crée/corrige le compte RabbitMQ même sur un volume déjà initialisé - voir docs/docker-migration.md.
  rabbitmq-init:
    image: rabbitmq:3-management
    container_name: indicateurs_rabbitmq_init
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq:ro
    entrypoint:
      - sh
      - -c
      - |
        NODE=rabbit@indicateurs_rabbitmq
        USER="$${RABBITMQ_USER:-indicateurs}"
        PASS="$$RABBITMQ_PASSWORD"
        i=0
        until rabbitmqctl -n "$$NODE" status >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -ge 15 ]; then
            echo "RabbitMQ ($$NODE) injoignable après 30s." >&2
            exit 1
          fi
          echo "En attente de RabbitMQ ($$NODE)..."
          sleep 2
        done
        if rabbitmqctl -n "$$NODE" list_users | awk '{print $$1}' | grep -qx "$$USER"; then
          echo "Compte $$USER déjà présent, mise à jour du mot de passe."
          rabbitmqctl -n "$$NODE" change_password "$$USER" "$$PASS"
        else
          echo "Création du compte $$USER."
          rabbitmqctl -n "$$NODE" add_user "$$USER" "$$PASS"
        fi
        rabbitmqctl -n "$$NODE" set_user_tags "$$USER" administrator
        rabbitmqctl -n "$$NODE" set_permissions -p / "$$USER" ".*" ".*" ".*"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - platon-network
    restart: "no"

  # Service éphémère : applique les migrations TypeORM en attente avant que l'API ne démarre.
  migrate:
    image: indicateurs-api
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: indicateurs_migrate
    logging: *default-logging
    env_file:
      - .env
    environment:
      PLATON_DB_HOST: platon_postgres
      INDICATORS_DB_HOST: platon_postgres
    command: yarn migration:run
    depends_on:
      init-db:
        condition: service_completed_successfully
    networks:
      - platon-network
    restart: "no"

  api:
    restart: always
    # Nom stable pour que "migrate" réutilise la même image sans la reconstruire.
    image: indicateurs-api
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: indicateurs_api
    logging: *default-logging
    env_file:
      - .env
    environment:
      # NODE_ENV vient de .env : en local, "production" fait échouer la vérif JWT (secret universitaire inconnu).
      # Hosts Docker : remplacent les valeurs localhost du .env
      PLATON_DB_HOST: platon_postgres
      INDICATORS_DB_HOST: platon_postgres
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-indicateurs}:${RABBITMQ_PASSWORD}@indicateurs_rabbitmq:5672
      REDIS_HOST: platon_redis
    depends_on:
      init-db:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - platon-network

  nginx:
    restart: always
    build:
      context: .
      dockerfile: .docker/frontend/Dockerfile
    container_name: indicateurs_nginx
    logging: *default-logging
    ports:
      - "${INDICATEURS_PORT:-4300}:80"
    depends_on:
      - api
    networks:
      - platon-network

volumes:
  rabbitmqdata:

networks:
  platon-network:
    external: true
    # PLaTon ne fixe pas de `name:`, le réseau est donc préfixé par son projet - détecté par bin/docker/up.sh, voir docker.md.
    name: ${PLATON_NETWORK_NAME:-platon_platon-network}
