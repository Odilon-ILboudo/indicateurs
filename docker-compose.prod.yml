# Mode production : stack complète (RabbitMQ + API + Frontend Nginx)
#
# Prérequis : le projet PLaTon doit tourner sur le même hôte avec le réseau
# platon-network. Les containers platon_postgres et platon_redis doivent
# être accessibles via ce réseau.

# Rotation des logs Docker (json-file) : sans ça, les logs de chaque service
# s'accumulent indéfiniment sur le disque du serveur. Plafonne à 5 fichiers de
# 10 Mo max par service (50 Mo). Ne couvre pas la centralisation/recherche
# après coup (Loki/ELK) ni les alertes (Sentry) - volontairement hors scope
# tant que la charge ne le justifie pas.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Service éphémère (tourne une fois, s'arrête) : crée la base "indicators" sur
  # le Postgres de PLaTon si elle n'existe pas encore. PLaTon ne provisionne que
  # sa propre base (POSTGRES_DB) - on ne modifie jamais ses fichiers, donc cette
  # étape se fait ici plutôt qu'un CREATE DATABASE manuel oublié en déploiement.
  init-db:
    image: postgres:13-alpine
    container_name: indicateurs_init_db
    logging: *default-logging
    env_file:
      - .env
    environment:
      PLATON_DB_HOST: platon_postgres
      PGPASSWORD: ${PLATON_DB_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        until pg_isready -h "$$PLATON_DB_HOST" -U "$$PLATON_DB_USERNAME" -q; do
          echo "En attente de Postgres ($$PLATON_DB_HOST)..."
          sleep 2
        done
        exists=$$(psql -h "$$PLATON_DB_HOST" -U "$$PLATON_DB_USERNAME" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$INDICATORS_DB_NAME'")
        if [ "$$exists" = "1" ]; then
          echo "Base $$INDICATORS_DB_NAME déjà présente."
        else
          echo "Création de la base $$INDICATORS_DB_NAME..."
          psql -h "$$PLATON_DB_HOST" -U "$$PLATON_DB_USERNAME" -d postgres -c "CREATE DATABASE \"$$INDICATORS_DB_NAME\""
        fi
    networks:
      - platon-network
    restart: "no"

  rabbitmq:
    restart: always
    image: rabbitmq:3-management
    container_name: indicateurs_rabbitmq
    logging: *default-logging
    environment:
      # Ne prend effet qu'au premier démarrage sur un volume vierge - sinon
      # (volume déjà initialisé avec guest) sans effet, voir docker-migration.md.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-indicateurs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - platon-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service éphémère : applique les migrations TypeORM en attente (voir
  # api/src/migrations/ et bin/migration/*.sh) avant que l'API ne démarre.
  # Réutilise la même image que le service "api" (voir sa note "image:").
  migrate:
    image: indicateurs-api
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: indicateurs_migrate
    logging: *default-logging
    env_file:
      - .env
    environment:
      PLATON_DB_HOST: platon_postgres
      INDICATORS_DB_HOST: platon_postgres
    command: yarn migration:run
    depends_on:
      init-db:
        condition: service_completed_successfully
    networks:
      - platon-network
    restart: "no"

  api:
    restart: always
    # Nom stable pour que le service "migrate" ci-dessus réutilise la même
    # image sans la reconstruire (Compose ne rebuild qu'une fois, même build:).
    image: indicateurs-api
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: indicateurs_api
    logging: *default-logging
    env_file:
      - .env
    environment:
      # NODE_ENV vient de .env (pas figé ici) : AuthGuard vérifie
      # cryptographiquement la signature JWT en production, ce qui échoue
      # systématiquement en local puisqu'on s'authentifie sur le vrai PLaTon
      # universitaire (secret de signature inconnu ici) - voir auth.guard.ts.
      # Hosts Docker : remplacent les valeurs localhost du .env
      PLATON_DB_HOST: platon_postgres
      INDICATORS_DB_HOST: platon_postgres
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-indicateurs}:${RABBITMQ_PASSWORD}@indicateurs_rabbitmq:5672
      REDIS_HOST: platon_redis
    depends_on:
      init-db:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - platon-network

  nginx:
    restart: always
    build:
      context: .
      dockerfile: .docker/frontend/Dockerfile
    container_name: indicateurs_nginx
    logging: *default-logging
    ports:
      - "${INDICATEURS_PORT:-4300}:80"
    depends_on:
      - api
    networks:
      - platon-network

volumes:
  rabbitmqdata:

networks:
  platon-network:
    external: true
    # Compose ne fixe pas de `name:` côté PLaTon, donc le réseau qu'il crée
    # réellement est préfixé par le nom du projet (dérivé du nom du dossier).
    # On ne modifie jamais les fichiers PLaTon : PLATON_NETWORK_NAME est détecté
    # automatiquement par bin/docker/up.sh (docker network ls), avec ce nom par
    # défaut comme repli si la détection échoue - voir docker.md.
    name: ${PLATON_NETWORK_NAME:-platon_platon-network}
