pipeline:
  - type: fetch
    params:
      table: SessionData
      contextFields: [user_id, activity_id]

  - label: "Calcul du taux de réussite"
    type: tauxReussite          # type "maison", non reconnu par le moteur
    params:
      code: |
        // input = tableau de sessions (SessionData) du contexte courant
        if (!Array.isArray(input) || input.length === 0) return 0;
        const reussites = input.filter(r => r.grade >= 100).length;
        return (reussites / input.length) * 100;

  - type: round
    params:
      decimals: 1
